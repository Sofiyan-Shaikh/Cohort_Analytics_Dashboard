# Render Blueprint for Cohort Analytics Dashboard
services:
  # Django Backend API
  - type: web
    name: cohort-analytics-api
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn cohort_analytics_dashboards.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.4"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: cohort-analytics-db
          property: connectionString

  # React Frontend (Static Site)
  - type: web
    name: cohort-analytics-frontend
    runtime: static
    buildCommand: "cd dashboard && npm install && npm run build"
    staticPublishPath: "dashboard/dist"
    envVars:
      - key: VITE_API_URL
        value: "https://cohort-analytics-api.onrender.com"

databases:
  - name: cohort-analytics-db
    plan: free
    databaseName: cohort_analytics
